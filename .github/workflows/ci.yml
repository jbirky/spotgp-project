name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lightweight deps: config/schema tests run everywhere; tests that
      # need spotgp/jax skip automatically when they are not installed.
      # To run the full end-to-end smoke test in CI, install spotgp
      # instead: pip install -r requirements.txt pytest
      - run: pip install pytest numpy pyyaml matplotlib pandas h5py
      - run: pytest -v
