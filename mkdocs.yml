site_name: spotgp-project
site_url: https://jessicabirky.com/spotgp-project/
site_description: Gaussian Process fits for stellar variability from starspot models

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Project Setup: project-setup.md
    - Interactive Explorer: gui-guide.md
    - YAML Config Guide: yaml-guide.md
    - Running on OSCER: oscer.md
  - Projects:
    - Gallery: projects/index.md
    - KIC-8507979: projects/KIC-8507979.md
    - Benchmarks:
      - The Sun as a Star: projects/sun-as-a-star.md
      - butterpy Injection-Recovery: projects/butterpy-injection-recovery.md
      - Kepler-411: projects/kepler-411.md
      - Kepler-63: projects/kepler-63.md
      - Kepler-17: projects/kepler-17.md
      - HAT-P-11: projects/hat-p-11.md
      - Kepler-71: projects/kepler-71.md
      - 16 Cygni A & B: projects/16-cygni.md
      - KIC 8006161: projects/kic-8006161.md
      - Benomar Sample: projects/benomar-dr-sample.md
      - Kamiaka Sample: projects/kamiaka-inclination-sample.md
      - Notsu Superflare Stars: projects/notsu-superflare-stars.md
      - Kepler Eclipsing Binaries: projects/kepler-eclipsing-binaries.md
      - Theta Cygni: projects/theta-cygni.md
      - Montet Cycle Sample: projects/montet-activity-cycles.md
      - NGC 6811 & NGC 6819: projects/kepler-clusters.md
